name: Validate PWS Data

on:
  push:
    paths:
      - 'keywords/categories/*.json'
      - 'templates/*.json'
      - 'schema/*.json'
      - 'tools/*.py'
  pull_request:
    paths:
      - 'keywords/categories/*.json'
      - 'templates/*.json'
      - 'schema/*.json'
      - 'tools/*.py'

jobs:
  validate-json:
    name: Validate JSON & Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all category files against schema
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          from jsonschema import validate, ValidationError

          schema = json.load(open("schema/keyword.schema.json"))
          errors = []
          valid = 0
          for fp in sorted(glob.glob("keywords/categories/*.json")):
              data = json.load(open(fp))
              if not isinstance(data, list):
                  data = [data]
              for item in data:
                  try:
                      validate(instance=item, schema=schema)
                      valid += 1
                  except ValidationError as e:
                      e_msg = item.get('id', '?')
                      errors.append(f"{fp}: id={e_msg} - {e.message}")
          total_valid = valid
          print(f"✅ Validated {total_valid} keywords, {len(errors)} errors")
          if errors:
              for e in errors[:20]:
                  print(f"  ❌ {e}")
              sys.exit(1)
          EOF

      - name: Check ID uniqueness
        run: |
          python3 - <<'EOF'
          import json, glob, re, sys
          pattern = re.compile(r'^[a-z][a-z0-9_]*$')
          ids = {}
          dupes = 0
          invalid = 0
          for fp in sorted(glob.glob("keywords/categories/*.json")):
              for item in json.load(open(fp)):
                  iid = item.get("id", "")
                  if not pattern.match(iid):
                      invalid += 1
                      print(f"  ❌ Invalid ID: {iid} in {fp}")
                  if iid in ids:
                      dupes += 1
                      print(f"  ❌ Duplicate ID: {iid}")
                  else:
                      ids[iid] = fp
          print(f"IDs: {len(ids)} unique, {dupes} dupes, {invalid} invalid")
          sys.exit(1 if (dupes or invalid) else 0)
          EOF

      - name: Check category enum consistency
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          schema = json.load(open("schema/keyword.schema.json"))
          valid_cats = set(schema["properties"]["category"]["enum"])
          violations = []
          for fp in sorted(glob.glob("keywords/categories/*.json")):
              file_cat = fp.split("/")[-1].replace(".json", "")
              if file_cat not in valid_cats:
                  v_msg = f"{fp}: category '{file_cat}' not in schema"
                  violations.append(v_msg)
              for item in json.load(open(fp)):
                  if item.get("category") not in valid_cats:
                      item_id = item.get('id','?')
                      item_cat = item.get('category')
                      v2 = f"{fp}: id={item_id} cat={item_cat}"
                      violations.append(v2)
          if violations:
              for v in violations[:20]:
                  print(f"  ❌ {v}")
              sys.exit(1)
          print(f"✅ All categories valid")
          EOF

      - name: Check metadata consistency
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          meta = json.load(open("keywords/_meta.json"))
          cats = glob.glob("keywords/categories/*.json")
          actual = sum(len(json.load(open(f))) for f in cats)
          meta_total = meta['total_keywords']
          meta_cats = meta['total_categories']
          if meta_total != actual:
              print(f"❌ total mismatch: meta={meta_total}, actual={actual}")
              sys.exit(1)
          file_count = len(cats)
          if meta_cats != file_count:
              print(f"❌ total_categories mismatch")
              sys.exit(1)
          print(f"✅ Metadata OK: {actual} keywords, {meta_cats} categories")
          EOF

      - name: Check index freshness
        run: |
          python3 - <<'EOF'
          import json, glob, sys, os
          index_path = "data/pws_index.json"
          if not os.path.exists(index_path):
              print("⚠️  Index missing — run `python3 tools/pws-index.py`")
              sys.exit(0)
          index = json.load(open(index_path))
          cats = glob.glob("keywords/categories/*.json")
          actual = sum(len(json.load(open(f))) for f in cats)
          index_total = index.get("total", 0)
          if index_total != actual:
              print(f"⚠️  Stale: index={index_total}, actual={actual}")
              print("  Run: python3 tools/pws-index.py")
              sys.exit(0)
          print(f"✅ Index fresh: {actual} entries in {index_path}")
          EOF

      - name: Check lifecycle coverage
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          errors = 0
          total = 0
          for fp in sorted(glob.glob("keywords/categories/*.json")):
              data = json.load(open(fp))
              for item in data:
                  total += 1
                  life = item.get("lifecycle")
                  if not life:
                      errors += 1
                      item_id = item.get('id')
                      print(f"  ❌ No lifecycle: {item_id} in {fp}")
          if errors:
              print(f"❌ {errors} missing lifecycle (total {total})")
              sys.exit(1)
          print(f"✅ All {total} keywords have lifecycle")
          EOF

      - name: Check underscore-prefixed fields
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          err_count = 0
          total = 0
          for fp in sorted(glob.glob("keywords/categories/*.json")):
              data = json.load(open(fp))
              for item in data:
                  total += 1
                  bad = [
                      k for k in item.keys()
                      if k.startswith("_") and not k.startswith("__")
                  ]
                  if bad:
                      err_count += 1
                      item_id = item.get('id')
                      print(f"  ❌ Underscore: {item_id} -> {bad}")
          if err_count:
              print(f"❌ {err_count} with underscore fields (total {total})")
              sys.exit(1)
          print(f"✅ All {total} keywords clean")
          EOF

  dedup-check:
    name: Deduplication Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run dedup check
        run: |
          python3 tools/pws-dedup.py --scan-all --format-report --quiet || true

  template-validate:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate template JSON syntax
        run: |
          python3 - <<'EOF'
          import json, glob, sys, re
          template_schema = json.load(open("schema/template.schema.json"))
          errors = 0
          valid = 0
          for fp in sorted(glob.glob("templates/*.json")):
              if "_meta" in fp or "_legacy" in fp:
                  continue
              try:
                  data = json.load(open(fp))
                  if isinstance(data, list):
                      for item in data:
                          if "variants" in item or "id" in item:
                              valid += 1
                              if "id" not in item or "variants" not in item:
                                  f_id = item.get('id','?')
                                  print(f"  ❌ Missing field {fp}: {f_id}")
                                  errors += 1
              except Exception as e:
                  print(f"  ❌ Error reading {fp}: {e}")
                  errors += 1
          print(f"✅ Validated {valid} templates, {errors} errors")
          sys.exit(1 if errors else 0)
          EOF
