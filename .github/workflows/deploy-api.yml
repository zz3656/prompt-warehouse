name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'keywords/**'
      - 'bundles/**'
      - 'workflows/**'
      - 'templates/**'
      - 'tools/generate-api.py'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate API
        run: python3 tools/generate-api.py

      - name: Upload api artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: api/

  deploy-api:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download api artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
          path: api/

      - name: Deploy API to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'api'
